name: eazy_attendance
description: "Eazy Attendance — native Android app for Bynex Labs school management system."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  dio: ^5.7.0

  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans_36pt-Bold.ttf
          weight: 700
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500